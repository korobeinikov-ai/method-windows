# Проверка на настоящей Windows: путь новичка по складу метода на домене — установщик и каталог с домена, пакеты
# архивами по sha256 в настоящем Claude Code, — установка с чистой машины, тесты всех зон.
# Бежит на каждый push в любую ветку и по кнопке. Скрипты внутри — только на ASCII: так их одинаково читает Windows PowerShell 5.1.
name: Windows
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      s_domena:
        description: 'Ставить как человек: с настоящего склада метода на домене (после выпуска)'
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Обычно склад метода — на этой же машине: собран из этого коммита (tests/sklad.py), домен metod.korobeinikov.ai ведёт
  # сюда записью в hosts — проверяем ровно этот коммит теми же адресами, что у человека. По кнопке s_domena — настоящий
  # склад на домене, как у человека. Claude при этом не запускается (чужой вход не нужен).
  S_DOMENA: ${{ inputs.s_domena && '1' || '' }}
  METHOD_NO_LAUNCH: '1'
jobs:
  windows:
    name: windows (${{ matrix.put }})
    runs-on: windows-latest
    timeout-minutes: 45
    # winget - the usual way; sayt - as if winget were missing: Git and Python from their own sites
    strategy:
      fail-fast: false
      matrix:
        put: [winget, sayt]
    env:
      METHOD_BEZ_WINGET: ${{ matrix.put == 'sayt' && '1' || '' }}
    defaults:
      run:
        shell: powershell
    steps:
      # Настройки Git раннера не меняем: установка тоже их не трогает, LF в файлах держит .gitattributes
      - uses: actions/checkout@v4

      - name: Разбор PowerShell-файлов
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1 -File | Where-Object { $_.FullName -notmatch '\\\.git\\' }) {
            $text = [IO.File]::ReadAllText($f.FullName, [Text.Encoding]::UTF8)
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errs)
            if ($errs.Count -gt 0) { $bad++; foreach ($e in $errs) { '{0}:{1} {2}' -f $f.Name, $e.Extent.StartLineNumber, $e.Message } }
            else { 'ok ' + $f.Name }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Что есть на машине до установки
        run: |
          $ErrorActionPreference = 'Continue'
          'PowerShell: ' + $PSVersionTable.PSVersion
          'winget: ' + (winget --version)
          'git: ' + (Get-Command git -All -ErrorAction SilentlyContinue | ForEach-Object Source)
          'python: ' + (Get-Command python -All -ErrorAction SilentlyContinue | ForEach-Object Source)
          'claude: ' + (Get-Command claude -All -ErrorAction SilentlyContinue | ForEach-Object Source)
          exit 0

      - name: Помощник - окружение как после перезапуска приложения Claude
        run: |
          $fresh = @'
          # Like a new Claude session after a restart: paths and variables come from the registry, not from the runner process.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          foreach ($n in 'CLAUDE_CODE_USE_POWERSHELL_TOOL', 'CLAUDE_CODE_GIT_BASH_PATH', 'PYTHONUTF8') {
              $v = [Environment]::GetEnvironmentVariable($n, 'User')
              if ($null -ne $v) { [Environment]::SetEnvironmentVariable($n, $v, 'Process') }
          }
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding $false
          '@
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'fresh.ps1') -Value $fresh -Encoding ASCII

      - name: Склад метода на этой машине (из этого коммита), домен ведёт сюда
        if: ${{ !env.S_DOMENA }}
        run: |
          $ErrorActionPreference = 'Stop'
          $t = $env:RUNNER_TEMP
          # Python for the stand-in server: a copy outside the search paths (the install below must find none)
          $py = (Get-Command python -ErrorAction Stop).Source
          Copy-Item (Split-Path $py) (Join-Path $t 'srvpy') -Recurse
          # A certificate for the domain: openssl of the preinstalled Git (the install step removes Git)
          $env:MSYS_NO_PATHCONV = '1'
          $ssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          $ErrorActionPreference = 'Continue'
          & $ssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=metod.korobeinikov.ai' -addext 'subjectAltName=DNS:metod.korobeinikov.ai' -keyout "$t\sklad.key" -out "$t\sklad.crt" 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { 'openssl failed'; exit 1 }
          $ErrorActionPreference = 'Stop'
          # Trusted by PowerShell (irm) and curl.exe through the Windows store, by Claude Code through NODE_EXTRA_CA_CERTS
          Import-Certificate -FilePath "$t\sklad.crt" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "NODE_EXTRA_CA_CERTS=$t\sklad.crt"
          # The domain leads to this machine's own network address: Claude Code takes no archives from 127.0.0.1
          $ip = (Get-NetIPConfiguration | Where-Object { $_.IPv4DefaultGateway } | Select-Object -First 1).IPv4Address.IPAddress
          if (-not $ip) { 'no network address'; exit 1 }
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`r`n$ip metod.korobeinikov.ai" -Encoding ASCII
          Clear-DnsClientCache
          # The runner stops a step's processes when the step ends: every step that needs the sklad calls this helper first.
          # It starts the server through WMI (outside the step), if it does not answer yet.
          $zhiv = @"
          `$u = 'https://metod.korobeinikov.ai/windows/marketplace.json'
          function Test-Sklad { try { return (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri `$u).StatusCode -eq 200 } catch { 'sklad: not answering yet (' + `$_.Exception.Message + ')' | Out-Host; return `$false } }
          if (-not (Test-Sklad)) {
              `$c = '"$t\srvpy\python.exe" -I "$env:GITHUB_WORKSPACE\tests\sklad.py" "$env:GITHUB_WORKSPACE" "$t\sklad.crt" "$t\sklad.key" "$t\sklad.log"'
              `$r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = `$c; CurrentDirectory = '$t' }
              'sklad: started, pid ' + `$r.ProcessId + ', code ' + `$r.ReturnValue | Out-Host
              `$ok = `$false
              for (`$i = 0; `$i -lt 30 -and -not `$ok; `$i++) { Start-Sleep -Seconds 1; `$ok = Test-Sklad }
              if (-not `$ok) { Get-Content '$t\sklad.log' -ErrorAction SilentlyContinue | Out-Host; throw 'the stand-in sklad does not answer on https://metod.korobeinikov.ai' }
          }
          "@
          Set-Content -Path (Join-Path $t 'sklad-zhiv.ps1') -Value $zhiv -Encoding ASCII
          . (Join-Path $t 'sklad-zhiv.ps1')
          Get-Content "$t\sklad.log"
          'sklad: https://metod.korobeinikov.ai -> ' + $ip + ' (this machine)'

      - name: Установка с чистой машины (без Git и Python)
        id: install
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding $false
          # 1. Remove Git: it is preinstalled on this machine, but a person may have none
          $git = 'C:\Program Files\Git'
          $unins = Join-Path $git 'unins000.exe'
          if (Test-Path $unins) { Start-Process $unins -ArgumentList '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES' -Wait }
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $git 'bin\bash.exe')); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path $git) { Remove-Item $git -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path (Join-Path $git 'bin\bash.exe')) { throw 'Git is still installed' }
          # The py launcher finds Pythons through the registry: wipe those keys and hide the preinstalled copies
          foreach ($k in 'HKLM:\SOFTWARE\Python', 'HKLM:\SOFTWARE\WOW6432Node\Python', 'HKCU:\SOFTWARE\Python') {
              if (Test-Path $k) { Remove-Item $k -Recurse -Force }
          }
          $tc = 'C:\hostedtoolcache\windows\Python'
          if (Test-Path $tc) { Rename-Item $tc 'Python-hidden' }
          # 2. Remove Git and the preinstalled Python from the search paths: system, user and this window
          $drop = '\\Git\\|\\Git$|hostedtoolcache\\windows\\Python'
          foreach ($scope in 'Machine', 'User') {
              $p = [Environment]::GetEnvironmentVariable('Path', $scope)
              $keep = @(($p -split ';') | Where-Object { $_ -ne '' -and $_ -notmatch $drop })
              [Environment]::SetEnvironmentVariable('Path', ($keep -join ';'), $scope)
          }
          $env:Path = (@(($env:Path -split ';') | Where-Object { $_ -ne '' -and $_ -notmatch $drop })) -join ';'
          # 3. Make sure the machine is clean
          if (Get-Command git -ErrorAction SilentlyContinue) { throw 'git is still visible' }
          $py = Get-Command python -ErrorAction SilentlyContinue
          if ($py -and $py.Source -notmatch 'WindowsApps') { throw ('real python is still visible: ' + $py.Source) }
          if (Get-Command py -ErrorAction SilentlyContinue) {
              $ErrorActionPreference = 'Continue'
              $global:LASTEXITCODE = 1
              py -3 -c 'pass' *> $null
              if ($LASTEXITCODE -eq 0) { throw 'the py launcher still finds a Python' }
              $ErrorActionPreference = 'Stop'
          }
          'clean machine: no git, no real python, python = ' + [string]$py.Source
          # 4. The install line like a person runs it: from the domain, through iex
          $ErrorActionPreference = 'Continue'
          $h = Join-Path $env:RUNNER_TEMP 'sklad-zhiv.ps1'; if (Test-Path $h) { . $h }  # the stand-in sklad answers
          irm https://metod.korobeinikov.ai/windows/install.ps1 | iex
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The final checkout step needs git: show it the installed one
          $g = (Get-Command git -ErrorAction SilentlyContinue).Source
          if ($g) { Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $g) }

      - name: Claude Code - версия, проверка полки и пакета, пакет в списке
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:RUNNER_TEMP 'fresh.ps1')
          $h = Join-Path $env:RUNNER_TEMP 'sklad-zhiv.ps1'; if (Test-Path $h) { . $h }  # the stand-in sklad answers
          claude --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          claude plugin validate .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          claude plugin validate plugins/osnova
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $shelf = claude plugin marketplace list | Out-String
          $shelf
          if ($shelf -notmatch 'korobeinikov-ai-windows') { 'the shelf korobeinikov-ai-windows is not added'; exit 1 }
          $list = claude plugin list | Out-String
          $list
          if ($list -notmatch 'osnova@korobeinikov-ai-windows') { 'osnova is not in the plugin list'; exit 1 }
          if ($list -notmatch 'stroka@korobeinikov-ai-windows') { 'stroka is not in the plugin list'; exit 1 }
          claude plugin validate plugins/stroka
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

      - name: Изнутри Claude (как в приложении) - подготовка не ставит Claude и не запускает его
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:RUNNER_TEMP 'fresh.ps1')
          $h = Join-Path $env:RUNNER_TEMP 'sklad-zhiv.ps1'; if (Test-Path $h) { . $h }  # the stand-in sklad answers
          # The app has its own copy of Claude: its path comes in CLAUDE_CODE_EXECPATH, a claude command may be absent
          $c = (Get-Command claude -ErrorAction SilentlyContinue).Source
          if (-not $c) { 'claude is missing'; exit 1 }
          $env:CLAUDE_CODE_EXECPATH = $c
          Remove-Item Env:METHOD_NO_LAUNCH -ErrorAction SilentlyContinue
          # A base method block from the kits (CRLF, as Windows editors write it): the install removes only the block
          $cm = Join-Path $env:USERPROFILE '.claude\CLAUDE.md'
          $own = "# my rules`r`nbe short`r`n"
          [IO.File]::WriteAllText($cm, $own + "`r`n<!-- korobeinikov-ai-baza:start v1 -->`r`nbase rules`r`n<!-- korobeinikov-ai-baza:end -->`r`n")
          # The command of the instruction (CLAUDE.md): the install line from the domain
          $out = irm https://metod.korobeinikov.ai/windows/install.ps1 | iex *>&1 | Out-String
          $out
          if ([IO.File]::ReadAllText($cm) -ne $own) { 'base method block not removed or own lines changed'; exit 1 }
          if (-not (Get-ChildItem (Split-Path $cm) -Filter 'CLAUDE.md.bak-korobeinikov-*')) { 'no backup of CLAUDE.md'; exit 1 }
          Remove-Item $cm, (Join-Path (Split-Path $cm) 'CLAUDE.md.bak-korobeinikov-*') -ErrorAction SilentlyContinue
          # Russian words as regex escapes: this script stays ASCII. "Stavlyu Claude" = it tried to install Claude
          if ($out -match '\u0421\u0442\u0430\u0432\u043b\u044e Claude') { 'inside Claude the install must not install Claude'; exit 1 }
          if ($out -notmatch '\u043d\u043e\u0432\u043e\u043c \u0441\u0435\u0430\u043d\u0441\u0435') { 'no line about the new session'; exit 1 }
          # "ITOG: [ok]" - everything installed and checked, the result for Claude is there
          if ($out -notmatch '\u0418\u0422\u041e\u0413: \u2705') { 'no ok result line'; exit 1 }
          exit 0

      - name: \u0427\u0430\u0442 \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0438 - \u043b\u0438\u0447\u043d\u0430\u044f \u0441\u0441\u044b\u043b\u043a\u0430, \u043d\u0430\u0441\u0442\u0440\u043e\u0439\u043a\u0438 \u0438 \u043f\u0440\u043e\u0435\u043a\u0442 \u043f\u043e \u043f\u0443\u0442\u044f\u043c \u0438\u0437 \u0432\u044b\u0432\u043e\u0434\u0430 \u043f\u043e\u0434\u0433\u043e\u0442\u043e\u0432\u043a\u0438
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:RUNNER_TEMP 'fresh.ps1')
          $h = Join-Path $env:RUNNER_TEMP 'sklad-zhiv.ps1'; if (Test-Path $h) { . $h }  # the stand-in sklad answers
          $env:CLAUDE_CODE_EXECPATH = (Get-Command claude -ErrorAction SilentlyContinue).Source
          Remove-Item Env:METHOD_NO_LAUNCH -ErrorAction SilentlyContinue
          # A link the server does not know: the real server answers 410 with the reason, and the reason must reach Claude in Russian.
          # The domain leads to the stand-in sklad here: the link of the old address goes to the real server (old links still work).
          $env:METHOD_DOSTUP = 'https://metod.korobeinikov.ai/u/netakoyssylki123'
          if (-not $env:S_DOMENA) { $env:METHOD_DOSTUP = 'https://korobeinikov-ai.up.' + 'railway.app/u/netakoyssylki123' }
          # A separate process with its whole output read, like Claude's own tool runs it (Out-Host lines go to stdout there)
          $out = powershell -NoProfile -ExecutionPolicy Bypass -Command 'irm https://metod.korobeinikov.ai/windows/install.ps1 | iex' 2>&1 | Out-String
          $out
          if ($out -notmatch '\u0414\u041e\u0421\u0422\u0423\u041f: \u274c') { 'a refused access link is not reported'; exit 1 }
          if ($out -notmatch '\u0441\u0440\u0430\u0431\u043e\u0442\u0430\u043b\u0430') { 'the reason of the refusal did not reach Claude'; exit 1 }
          # The settings block and the check reach Claude too
          if ($out -notmatch '\u041e\u0445\u0440\u0430\u043d\u0430 \u0441\u0435\u043a\u0440\u0435\u0442\u043e\u0432 \u0441\u0440\u0430\u0431\u0430\u0442\u044b\u0432\u0430\u0435\u0442') { 'the guard check is not in the output'; exit 1 }
          Remove-Item Env:METHOD_DOSTUP -ErrorAction SilentlyContinue
          # The install report went by the personal link to the sklad (the domain leads here): technical fields only,
          # no home folder, no user name. The refused link = "with warnings", the place = the reason ("srabotala").
          if (-not $env:S_DOMENA) {
              $line = @(Get-Content -Encoding UTF8 (Join-Path $env:RUNNER_TEMP 'sklad.log') | Where-Object { $_.StartsWith('OTCHET: ') } | Select-Object -Last 1)
              if (-not $line) { 'no install report reached the sklad'; exit 1 }
              $r = $line[0].Substring(8) | ConvertFrom-Json
              $r | Format-List | Out-String
              if ($r._put -ne '/u/netakoyssylki123/otchet' -or $r.os -ne 'windows' -or $r.itog -ne 'preduprezhdeniya') { 'report: wrong link, os or result'; exit 1 }
              if ($r.stroki -notmatch '\u0414\u041e\u0421\u0422\u0423\u041f: \u274c' -or $r.shag -notmatch '\u0441\u0440\u0430\u0431\u043e\u0442\u0430\u043b\u0430') { 'report: no access line or place'; exit 1 }
              if ($r.sistema -notmatch '^Windows 1[01] \(10\.0\.\d+\)$' -or $r.paket -notmatch '^[0-9a-f]{12}$' -or $r.claude -notmatch '^\d' -or $r.sekund -notmatch '^\d+$') { 'report: system or versions'; exit 1 }
              $all = [string]$r.shag + [string]$r.stroki + [string]$r.hvost
              if ($all -match [regex]::Escape($env:USERNAME) -or $all -match '(?i)[A-Z]:[\\/]Users') { 'report: home folder or user name in it'; exit 1 }
              # "Otchet ob ustanovke ushel" - the person sees that the report went
              if ($out -notmatch '\u041e\u0442\u0447\u0451\u0442 \u043e\u0431 \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0435 \u0443\u0448\u0451\u043b') { 'no line about the sent report'; exit 1 }
          }
          # Paths for the next steps, like Claude reads them: BASH, PY, PROVODNIK, DANNYE
          $P = -join [char[]](0x41F, 0x420, 0x41E, 0x412, 0x41E, 0x414, 0x41D, 0x418, 0x41A)
          $D = -join [char[]](0x414, 0x410, 0x41D, 0x41D, 0x42B, 0x415)
          $m = @{}
          foreach ($l in ($out -split "`r?`n")) { if ($l -match '^([^=\s]+)=(.+)$') { $m[$Matches[1]] = $Matches[2].Trim() } }
          foreach ($k in 'BASH', 'PY', $P, $D) { if (-not $m[$k]) { 'no path in the output: ' + $k; exit 1 } }
          # Settings and the project in one PowerShell line, as Claude runs them. The name is Russian: the letters must survive
          $title = (-join [char[]](0x41A, 0x43E, 0x444, 0x435, 0x439, 0x43D, 0x44F)) + ' Zerno'
          & $m['BASH'] $m['PY'] ($m[$P] + '/nastroyki.py') ustanovit --data $m[$D]; $rc1 = $LASTEXITCODE; & $m['BASH'] $m['PY'] ($m[$P] + '/novyi_proekt.py') kofeynya-zerno $title 'kofe s soboy' --data $m[$D] --zadacha 'uchet prodazh'
          if ($rc1 -ne 0) { 'nastroyki.py ustanovit failed'; exit 1 }
          if ($LASTEXITCODE -ne 0) { 'novyi_proekt.py failed'; exit 1 }
          $proj = Join-Path $env:USERPROFILE 'vibecoding\kofeynya-zerno'
          $claudeMd = [IO.File]::ReadAllText((Join-Path $proj 'CLAUDE.md'), [Text.Encoding]::UTF8)
          if (-not $claudeMd.Contains($title)) { 'the Russian name broke on the way'; exit 1 }
          foreach ($f in 'gotovo', 'sprosit-zadachu', 'zadacha', 'nastroyki-versiya') {
              if (-not (Test-Path (Join-Path $m[$D] $f))) { 'no mark in the plugin data: ' + $f; exit 1 }
          }
          $s = Get-Content (Join-Path $env:USERPROFILE '.claude\settings.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($s.permissions.defaultMode -ne 'auto') { 'the settings were not applied'; exit 1 }
          # The next session in the project folder: the start hook says "the project is just created" and keeps the task
          $env:CLAUDE_PLUGIN_ROOT = (Split-Path (Split-Path $m[$P])) -replace '\\', '/'
          $env:CLAUDE_PLUGIN_DATA = $m[$D]
          $env:CLAUDE_PROJECT_DIR = $proj
          Push-Location $proj
          $hook = & $m['BASH'] ($env:CLAUDE_PLUGIN_ROOT + '/hooks/session-start.sh') 2>&1 | Out-String
          Pop-Location
          if ($hook -notmatch 'uchet prodazh') { $hook; 'the next session does not know the task'; exit 1 }
          'install chat: refused a foreign link, applied settings, created the project, the next session knows the task'
          exit 0

      - name: Отчёт об установке не ушёл - установка и её код те же
        if: ${{ !cancelled() && steps.install.outcome == 'success' && !env.S_DOMENA }}
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:RUNNER_TEMP 'fresh.ps1')
          $h = Join-Path $env:RUNNER_TEMP 'sklad-zhiv.ps1'; if (Test-Path $h) { . $h }  # the stand-in sklad answers
          $env:CLAUDE_CODE_EXECPATH = (Get-Command claude -ErrorAction SilentlyContinue).Source
          Remove-Item Env:METHOD_NO_LAUNCH -ErrorAction SilentlyContinue
          # The stand-in sklad answers 503 to reports of links that start with "sboy"
          $env:METHOD_DOSTUP = 'https://metod.korobeinikov.ai/u/sboyotcheta123'
          $out = powershell -NoProfile -ExecutionPolicy Bypass -Command 'irm https://metod.korobeinikov.ai/windows/install.ps1 | iex; exit $LASTEXITCODE' 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out
          Remove-Item Env:METHOD_DOSTUP -ErrorAction SilentlyContinue
          if ($code -ne 0) { 'the install exit code changed: ' + $code; exit 1 }
          if ($out -notmatch '\u0418\u0422\u041e\u0413: \u2705') { 'no ok result line'; exit 1 }
          if ($out -notmatch '503') { 'the failed report is not on stderr'; exit 1 }
          'a failed report does not change the install'
          exit 0

      - name: Новая схема - каталог и архивы с домена, sha256, распаковка, настройки автообновления
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:RUNNER_TEMP 'fresh.ps1')
          $h = Join-Path $env:RUNNER_TEMP 'sklad-zhiv.ps1'; if (Test-Path $h) { . $h }  # the stand-in sklad answers
          $base = 'https://metod.korobeinikov.ai/windows'
          $bad = 0
          function Fail($m) { 'FAIL: ' + $m; $script:bad++ }
          # The catalog, as Claude Code takes it
          $k = irm "$base/marketplace.json"
          if ($k.name -ne 'korobeinikov-ai-windows') { Fail ('catalog name: ' + $k.name) }
          if ((@($k.plugins | ForEach-Object name) -join ',') -ne 'osnova,stroka') { Fail 'catalog plugins are not osnova,stroka' }
          $inst = Get-Content -Raw -Encoding UTF8 (Join-Path $env:USERPROFILE '.claude\plugins\installed_plugins.json') | ConvertFrom-Json
          foreach ($p in $k.plugins) {
              $s = $p.source
              if ($s.source -ne 'archive' -or -not $s.url.StartsWith("$base/plugins/") -or $s.sha256 -notmatch '^[0-9a-f]{64}$') { Fail ($p.name + ': source is not an archive on the domain'); continue }
              # The archive, its sha256 and unpacking - by hand, like Claude Code does it
              $z = Join-Path $env:RUNNER_TEMP ($p.name + '.zip')
              Invoke-WebRequest -UseBasicParsing -Uri $s.url -OutFile $z
              $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $z).Hash.ToLowerInvariant()
              if ($sha -ne $s.sha256) { Fail ($p.name + ': sha256 of the archive differs from the catalog') }
              $d = Join-Path $env:RUNNER_TEMP ('unz-' + $p.name)
              Expand-Archive -LiteralPath $z -DestinationPath $d -Force
              if (-not (Test-Path (Join-Path $d '.claude-plugin\plugin.json'))) { Fail ($p.name + ': no plugin.json in the archive') }
              # Claude Code installed exactly this archive: its version is the start of the sha
              $i = @($inst.plugins.($p.name + '@korobeinikov-ai-windows'))[0]
              if ($i.version -ne $s.sha256.Substring(0, 12)) { Fail ($p.name + ': installed version ' + $i.version + ' is not the archive ' + $s.sha256.Substring(0, 12)) }
              if (-not (Test-Path (Join-Path $i.installPath '.claude-plugin\plugin.json'))) { Fail ($p.name + ': installed folder is empty') }
              'ok ' + $p.name + ' ' + $s.sha256.Substring(0, 12) + ' -> ' + $i.installPath
          }
          $o = Join-Path $env:RUNNER_TEMP 'unz-osnova'
          # Scripts keep LF after the archive (bash breaks on CR)
          $crlf = @(Get-ChildItem $o -Recurse -File -Include *.sh, *.py | Where-Object { [IO.File]::ReadAllText($_.FullName).Contains("`r") })
          if ($crlf.Count -gt 0) { Fail ('CRLF in scripts: ' + ($crlf.Name -join ', ')) }
          # One domain in the package: the messenger of knowledge and the auto-update
          $zn = [IO.File]::ReadAllText((Join-Path $o 'znaniya\znaniya.py'))
          if (-not $zn.Contains('SERVER = "https://metod.korobeinikov.ai"')) { Fail 'znaniya.py does not go to the domain' }
          # The shelf of Claude Code and the settings: the catalog from the domain, auto-update on
          $km = Get-Content -Raw -Encoding UTF8 (Join-Path $env:USERPROFILE '.claude\plugins\known_marketplaces.json') | ConvertFrom-Json
          $src = $km.'korobeinikov-ai-windows'.source
          if ($src.source -ne 'url' -or $src.url -ne "$base/marketplace.json") { Fail ('known shelf source: ' + ($src | ConvertTo-Json -Compress)) }
          $st = Get-Content -Raw -Encoding UTF8 (Join-Path $env:USERPROFILE '.claude\settings.json') | ConvertFrom-Json
          $m = $st.extraKnownMarketplaces.'korobeinikov-ai-windows'
          if ($m.autoUpdate -ne $true -or $m.source.source -ne 'url' -or $m.source.url -ne "$base/marketplace.json") { Fail ('auto-update setting: ' + ($m | ConvertTo-Json -Compress)) }
          if ($m.source.PSObject.Properties.Name -contains 'repo') { Fail 'auto-update source still has repo' }
          # The texts on the domain: the instruction leads to the install line, nobody sees the old server address
          $cm = irm "$base/CLAUDE.md"
          if (-not $cm.Contains('irm https://metod.korobeinikov.ai/windows/install.ps1 | iex')) { Fail 'CLAUDE.md on the domain has no install line' }
          foreach ($u in "$base/CLAUDE.md", "$base/", "$base/install.ps1") {
              $txt = [string](irm $u)
              if ($txt -match 'up\.railway\.app|raw\.githubusercontent') { Fail ('old address in ' + $u) }
          }
          # A catalog with a wrong sha256: Claude Code must refuse the archive (only the stand-in sklad has it)
          if (-not $env:S_DOMENA) {
              claude plugin marketplace add "$base/plohoy.json" 2>&1 | Out-Host
              $r = claude plugin install stroka@proverka-plohoy-sha 2>&1 | Out-String
              $r
              if ($r -notmatch 'integrity') { Fail 'Claude Code installed an archive with a wrong sha256' }
              $l = claude plugin list 2>&1 | Out-String
              if ($l -match 'stroka@proverka-plohoy-sha') { Fail 'the bad archive is in the plugin list' }
              claude plugin marketplace remove proverka-plohoy-sha 2>&1 | Out-Host
          }
          if ($bad -gt 0) { exit 1 }
          'new scheme: catalog and archives from the domain, sha256 matches, unpacked, installed exactly these, auto-update from the domain'
          exit 0

      - name: Посыльный за знаниями - как его запустит Claude Code (claude mcp list)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:RUNNER_TEMP 'fresh.ps1')
          $out = claude mcp list 2>&1 | Out-String
          $out
          if ($out -notmatch 'znaniya') { 'the knowledge server of the package is not listed'; exit 1 }
          exit 0

      - name: Инструменты пакета (gitleaks, ruff и др.) - как ставит проводник
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:RUNNER_TEMP 'fresh.ps1')
          $bash = $env:CLAUDE_CODE_GIT_BASH_PATH
          if (-not $bash -or -not (Test-Path $bash)) { 'Git Bash from the install is missing'; exit 1 }
          & $bash -c 'bash plugins/osnova/skills/start/instrumenty.sh 2>&1'
          if ($LASTEXITCODE -ne 0) { 'instrumenty.sh failed'; exit 1 }
          foreach ($n in 'gitleaks', 'ruff') {
              $f = Join-Path $env:USERPROFILE ('.local\bin\' + $n + '.exe')
              if (-not (Test-Path $f)) { $n + '.exe is missing in .local\bin'; exit 1 }
          }
          exit 0

      - name: Тесты на Git Bash (tests/test-*.sh)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          # Strict: a missing gitleaks, ruff or node is a failure, not a skip (otherwise the guard checks could silently vanish)
          KOROBEINIKOV_TEST_STRICT: '1'
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:RUNNER_TEMP 'fresh.ps1')
          $bash = $env:CLAUDE_CODE_GIT_BASH_PATH
          if (-not $bash -or -not (Test-Path $bash)) { 'Git Bash from the install is missing'; exit 1 }
          $logs = Join-Path $env:RUNNER_TEMP 'logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $failed = @()
          foreach ($t in @(Get-ChildItem tests -Filter 'test-*.sh' -ErrorAction SilentlyContinue | Sort-Object Name)) {
              '=== ' + $t.Name
              & $bash -c ('bash tests/{0} 2>&1' -f $t.Name) | Tee-Object -FilePath (Join-Path $logs ($t.Name + '.log'))
              if ($LASTEXITCODE -ne 0) { $failed += $t.Name; 'FAILED: ' + $t.Name }
          }
          if ($failed.Count -gt 0) { 'Failed bash tests: ' + ($failed -join ', '); exit 1 }
          exit 0

      - name: Тесты на PowerShell (tests/test-*.ps1)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:RUNNER_TEMP 'fresh.ps1')
          $h = Join-Path $env:RUNNER_TEMP 'sklad-zhiv.ps1'; if (Test-Path $h) { . $h }  # the stand-in sklad answers
          $logs = Join-Path $env:RUNNER_TEMP 'logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $failed = @()
          foreach ($t in @(Get-ChildItem tests -Filter 'test-*.ps1' -ErrorAction SilentlyContinue | Sort-Object Name)) {
              '=== ' + $t.Name
              # Windows PowerShell 5.1 reads a file without BOM as ANSI and breaks Russian letters: add a BOM in the CI workspace
              $text = [IO.File]::ReadAllText($t.FullName, [Text.Encoding]::UTF8)
              [IO.File]::WriteAllText($t.FullName, $text, (New-Object System.Text.UTF8Encoding $true))
              powershell -NoProfile -ExecutionPolicy Bypass -File $t.FullName | Tee-Object -FilePath (Join-Path $logs ($t.Name + '.log'))
              if ($LASTEXITCODE -ne 0) { $failed += $t.Name; 'FAILED: ' + $t.Name }
          }
          if ($failed.Count -gt 0) { 'Failed PowerShell tests: ' + ($failed -join ', '); exit 1 }
          exit 0

      - name: Склад на этой машине - журнал запросов (Claude Code брал архивы отсюда)
        if: ${{ !cancelled() && !env.S_DOMENA }}
        run: |
          $log = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'sklad.log') -ErrorAction SilentlyContinue
          $log
          foreach ($n in 'osnova', 'stroka') {
              if ($log -notmatch ('GET /windows/plugins/' + $n + '-[0-9a-f]{12}\.zip HTTP/1\.[01]" 200')) { 'no archive download of ' + $n + ' in the log'; exit 1 }
          }
          if ($log -notmatch 'GET /windows/install\.ps1 HTTP/1\.[01]" 200') { 'install.ps1 was not taken from the sklad'; exit 1 }
          exit 0

      - name: В логе нет значений ключей
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Shapes of keys that a test could print by mistake. Only names go to the output, never the values.
          # Fake keys in tests are assembled from pieces at run time, so we look for the shape, not the value.
          $shapes = [ordered]@{
              'anthropic-key'   = 'sk-ant-[A-Za-z0-9_-]{16,}'
              'openai-key'      = '\bsk-[A-Za-z0-9]{32,}'
              'github-token'    = '\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}'
              'telegram-token'  = '\b\d{8,10}:[A-Za-z0-9_-]{35}\b'
              'jwt'             = 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
              'aws-key'         = '\bAKIA[0-9A-Z]{16}\b'
              'private-key'     = '-----BEGIN [A-Z ]*PRIVATE KEY-----'
              'password-in-url' = '://[^\s:/@]+:[^\s@]{6,}@'
          }
          # First make sure the scanner itself sees a fake (assembled from pieces, printed nowhere)
          $canary = 'sk-' + 'ant-' + ('Q' * 24)
          if (-not [regex]::IsMatch($canary, $shapes['anthropic-key'])) { 'scanner self-check failed'; exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP 'logs'
          $files = @()
          if (Test-Path $dir) { $files = @(Get-ChildItem $dir -File) }
          'log files scanned: ' + $files.Count
          $hits = 0
          foreach ($f in $files) {
              $text = Get-Content -Raw -Path $f.FullName
              if (-not $text) { continue }
              foreach ($name in $shapes.Keys) {
                  $n = [regex]::Matches($text, $shapes[$name]).Count
                  if ($n -gt 0) { $hits++; ('KEY-LIKE VALUE in {0}: {1} x{2} (value hidden)' -f $f.Name, $name, $n) }
              }
          }
          if ($hits -gt 0) { exit 1 }
          'no key-like values in the logs'
          exit 0
